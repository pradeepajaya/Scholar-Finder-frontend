services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: scholar-finder-postgres
    environment:
      POSTGRES_USER: scholarfinder
      POSTGRES_PASSWORD: scholarfinder123
      POSTGRES_DB: scholarfinder_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - scholar-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U scholarfinder -d scholarfinder_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (for sessions and caching)
  redis:
    image: redis:7-alpine
    container_name: scholar-finder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - scholar-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch (for search functionality)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: scholar-finder-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9400:9200"
      - "9401:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - scholar-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Service Discovery - Eureka Server
  discovery-service:
    build: ./discovery-service
    container_name: scholar-finder-discovery
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    networks:
      - scholar-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: scholar-finder-gateway
    ports:
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - scholar-network

  # Authentication Service
  auth-service:
    build: ./auth-service
    container_name: scholar-finder-auth
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8081}:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/scholarfinder_db
      - SPRING_DATASOURCE_USERNAME=scholarfinder
      - SPRING_DATASOURCE_PASSWORD=scholarfinder123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:eureka123@discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=your-256-bit-secret-key-here-make-it-long-and-secure-for-production
      # JWT secret must be base64-encoded for the JwtTokenProvider (or use a raw key handled by the app)
      - JWT_SECRET=c3VwZXJzZWNyZXRrZXlzdXBlcnNlY3JldGtleTEyMzQ1Ng==
      - JWT_EXPIRATION=86400000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - scholar-network

  # User Service
  # user-service:
  #   build: ./user-service
  #   container_name: scholar-finder-user
  #   ports:
  #     - "8082:8082"
  #   environment:
  #     - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/scholarfinder_db
  #     - SPRING_DATASOURCE_USERNAME=scholarfinder
  #     - SPRING_DATASOURCE_PASSWORD=scholarfinder123
  #     - SPRING_REDIS_HOST=redis
  #     - SPRING_REDIS_PORT=6379
  #     - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
  #     - SPRING_PROFILES_ACTIVE=docker
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     discovery-service:
  #       condition: service_healthy
  #   networks:
  #     - scholar-network

  # Scholarship Service
  scholarship-service:
    build: ./scholarship-service
    container_name: scholar-finder-scholarship
    ports:
      - "${SCHOLARSHIP_SERVICE_HOST_PORT:-8083}:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/scholarfinder_db
      - SPRING_DATASOURCE_USERNAME=scholarfinder
      - SPRING_DATASOURCE_PASSWORD=scholarfinder123
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:eureka123@discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - scholar-network

  # Content Service (News & Blogs)
  content-service:
    build: ./content-service
    container_name: scholar-finder-content
    ports:
      - "${CONTENT_SERVICE_HOST_PORT:-18084}:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/scholarfinder_db
      - SPRING_DATASOURCE_USERNAME=scholarfinder
      - SPRING_DATASOURCE_PASSWORD=scholarfinder123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:eureka123@discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - scholar-network

  # Notification Service (Contact Us & Email)
  notification-service:
    build: ./notification-service
    container_name: scholar-finder-notification
    env_file:
      - .env
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT:-8085}:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/scholarfinder_db
      - SPRING_DATASOURCE_USERNAME=scholarfinder
      - SPRING_DATASOURCE_PASSWORD=scholarfinder123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:eureka123@discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - scholar-network

networks:
  scholar-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
