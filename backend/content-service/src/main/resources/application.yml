server:
  port: 8084

spring:
  application:
    name: content-service

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/scholarfinder_db
    username: scholarfinder
    password: scholarfinder123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: content

  # File upload configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Disable automatic static resource mappings so API controller paths
  # (e.g. /api/**) are handled by controllers instead of the resource handler.
  web:
    resources:
      add-mappings: false

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Content Configuration
content:
  news:
    page-size: 10
    featured-count: 5
  blog:
    page-size: 12
    recent-count: 6

app:
  notifications:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
  mail:
    admin-email: ${ADMIN_EMAIL:admin@scholarfinder.lk}

# Logging
logging:
  level:
    com.scholarfinder.content: DEBUG
    org.hibernate.SQL: DEBUG
