server:
  port: 8083

spring:
  application:
    name: scholarship-service
  
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/scholarfinder_db
    username: scholarfinder
    password: scholarfinder123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: scholarships

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Matching Algorithm Configuration
matching:
  weights:
    education-level: 15
    academic-performance: 10
    english-proficiency: 10
    age: 5
    nationality: 10
    financial-need: 5
    field-of-study: 25
    preferred-country: 15
    funding-type: 10
    special-categories: 5
  thresholds:
    minimum-match-percentage: 50
    excellent-match: 90
    good-match: 75

# Logging
logging:
  level:
    com.scholarfinder.scholarship: INFO
    org.hibernate.SQL: WARN
